openapi: 3.1.0
info:
  title: Meal Plan Pro API
  description: API for managing meal plans, kitchen inventory, and recipes. Check food in fridge/freezer/pantry, view weekly meal plans, and access recipes.
  version: 1.0.0
  contact:
    name: Meal Plan Pro Support

servers:
  - url: https://eucwtwejktcjxowiybjy.supabase.co/functions/v1/unified-api
    description: Production API

security:
  - apiKey: []

paths:
  /inventory:
    get:
      operationId: getKitchenInventory
      summary: Get kitchen inventory items
      description: Get items in fridge, freezer, or pantry. Use for "What's in my fridge?", "What food do I have?", "What's expiring soon?" Returns items sorted by expiration date.
      parameters:
        - name: location
          in: query
          required: false
          description: Filter by location - fridge, freezer, or pantry. Optional.
          schema:
            type: string
            enum: [fridge, freezer, pantry]
      responses:
        '200':
          description: List of inventory items
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/InventoryItem'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /meal-plan:
    get:
      operationId: getMealPlan
      summary: Get weekly meal plan
      description: Get meal plan for a week. Use for "What's for dinner?", "What am I eating this week?" Returns meals by date and type (breakfast, lunch, dinner, snacks).
      parameters:
        - name: week_start
          in: query
          required: true
          description: Week start date in YYYY-MM-DD format. Use Monday or Sunday based on user preference.
          schema:
            type: string
            format: date
            example: "2024-01-15"
      responses:
        '200':
          description: Meal plan for the week
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MealPlanEntry'
        '400':
          description: Missing or invalid week_start parameter
        '401':
          $ref: '#/components/responses/Unauthorized'

  /recipes:
    get:
      operationId: getRecipes
      summary: Get recipes
      description: Get user's recipes. Use for "How do I make X?", "What's the recipe for Y?" Can filter by meal item name for specific dishes.
      parameters:
        - name: meal_item
          in: query
          required: false
          description: Filter by meal item name (partial match, case-insensitive).
          schema:
            type: string
            example: "chicken"
      responses:
        '200':
          description: List of recipes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Recipe'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /meal-items:
    get:
      operationId: getMealItems
      summary: Get meal items (dish catalog)
      description: Get saved dishes/meals. Use for "What meals do I have saved?", "What can I add to my meal plan?" These are reusable dishes for meal planning.
      responses:
        '200':
          description: List of meal items
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MealItem'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: API key from Settings > API Keys

  responses:
    Unauthorized:
      description: Authentication failed - invalid or missing API key
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Invalid API key"

  schemas:
    InventoryItem:
      type: object
      description: Kitchen inventory item with location, quantity, and expiration
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Name of the food item
          example: "Chicken breast"
        quantity:
          type: number
          description: Amount of the item
          example: 2
        unit:
          type: string
          nullable: true
          description: Unit of measurement
          example: "lbs"
        location:
          type: string
          enum: [fridge, freezer, pantry]
          description: Storage location
          example: "fridge"
        expiration_date:
          type: string
          format: date
          nullable: true
          description: Expiration date
          example: "2024-01-20"
        ready_to_eat:
          type: boolean
          description: Ready to eat without cooking
          example: false
        notes:
          type: string
          nullable: true
          description: Additional notes
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MealPlanEntry:
      type: object
      description: Meal plan entry for a date and meal type
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
          description: Date of this meal
          example: "2024-01-15"
        meal_type:
          type: string
          description: Meal type (breakfast, lunch, dinner, snack)
          example: "dinner"
        meal_items:
          type: array
          description: Planned dishes
          items:
            type: object
            properties:
              id:
                type: string
                description: Meal item reference
              name:
                type: string
                description: Dish name
                example: "Grilled Chicken Salad"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Recipe:
      type: object
      description: Recipe with ingredients and instructions
      properties:
        id:
          type: string
          format: uuid
        meal_item_id:
          type: string
          format: uuid
          description: Associated meal item ID
        title:
          type: string
          nullable: true
          description: Recipe title
          example: "Classic Grilled Chicken"
        recipe_type:
          type: string
          description: Recipe type (full, quick, notes)
        content:
          type: string
          description: Full recipe text
        meal_items:
          type: object
          description: Associated meal item
          properties:
            name:
              type: string
              example: "Grilled Chicken"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MealItem:
      type: object
      description: Saved dish for meal planning
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Dish name
          example: "Spaghetti Bolognese"
        category:
          type: string
          nullable: true
          description: Category (Italian, Quick meals, etc.)
          example: "Italian"
        notes:
          type: string
          nullable: true
          description: Notes about the dish
        image_url:
          type: string
          nullable: true
          description: Image URL
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
